const app=document.getElementById('app');

function openFolder(m){mode=m;page=0;if(m==='words')data=W.map((x,i)=>({e:x[0],j:x[1],id:'w'+i,n:i+1}));else if(m==='phrases')data=P.map((x,i)=>({e:x[0],j:x[1],id:'p'+i,n:1101+i}));else data=Object.values(wrong);render()}
